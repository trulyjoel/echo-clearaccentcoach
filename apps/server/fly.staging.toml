# fly.toml config for the kalli-server-staging (non-prod) app.
# Deploy with: flyctl deploy --config apps/server/fly.staging.toml
# See fly.toml for the production app config.

app = 'kalli-server-staging'
primary_region = 'yyz'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
