# Deploy skeleton — not yet deployed. Run `flyctl launch` / `flyctl deploy`
# from this directory once authenticated (see ticket 01 follow-up).
app = "callie-server"
primary_region = "iad"

[build]

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"
